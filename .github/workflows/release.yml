name: Release

# Push a tag like v0.2.0 to build AllDrop.app and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Resources/Info.plist
      - name: Build
        run: ./scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/AllDrop.app "AllDrop-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AllDrop-${GITHUB_REF_NAME}.zip" --generate-notes --title "AllDrop ${GITHUB_REF_NAME}"
